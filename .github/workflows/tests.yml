name: Offline research tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Run offline and native algorithm tests
        run: python -m unittest discover -s tests -v
      - name: Build the team handbook without private inputs
        run: python s3300.py guide derived/ci-team-guide
