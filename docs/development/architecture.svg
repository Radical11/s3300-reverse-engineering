<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">Firmware development artifact layers</title><desc id="desc">The preserved original update feeds independent decoders and resource extraction. The application map feeds references and contracts. Edited copies and our code form explicit validated candidate plans; a camera trial is a separate gated step.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#607080"/></marker></defs>
<rect width="1040" height="410" fill="#f4f7fb" rx="16"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#183047" text-anchor="middle">
<g fill="#e1edf7" stroke="#7996ad"><rect x="22" y="140" width="190" height="100" rx="10"/><rect x="270" y="35" width="215" height="105" rx="10"/><rect x="270" y="235" width="215" height="105" rx="10"/><rect x="548" y="35" width="205" height="105" rx="10"/><rect x="548" y="235" width="205" height="105" rx="10"/><rect x="815" y="140" width="205" height="100" rx="10"/></g>
<text x="117" y="177">Original v1.1 update</text><text x="117" y="202">immutable + SHA-256</text><text x="117" y="225" font-size="13">vendor input stays local</text>
<text x="378" y="72">Paired decoder outputs</text><text x="378" y="98">address-correct ELF</text><text x="378" y="120" font-size="13">analysis-only artifact</text>
<text x="378" y="271">Allocated resources</text><text x="378" y="296">editable format exports</text><text x="378" y="319" font-size="13">baseline + experiment copies</text>
<text x="650" y="72">Atlas + native analysis</text><text x="650" y="98">reviewed contracts</text><text x="650" y="120" font-size="13">evidence and unknowns</text>
<text x="650" y="272">Explicit patch plans</text><text x="650" y="297">our source + SDK</text><text x="650" y="319" font-size="13">bounded new artifacts</text>
<text x="918" y="177">Validated candidate</text><text x="918" y="202">separate trial package</text><text x="918" y="225" font-size="13">camera action stays gated</text>
<text x="520" y="385" font-size="14">Artifact derivation is established separately from on-camera behavior and unbootable recovery.</text>
</g>
